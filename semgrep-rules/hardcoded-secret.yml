rules:
  - id: hardcoded-fallback-jwt-secret
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: >
      Hardcoded fallback secret detected. Never supply a hardcoded string as a fallback for authentication secrets.
    patterns:
      - pattern: process.env.$SECRET || "..."
      - metavariable-regex:
          metavariable: $SECRET
          regex: (?i).*(secret|key|token|password).*