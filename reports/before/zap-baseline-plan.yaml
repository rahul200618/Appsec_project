env:
  contexts:
    - name: "Khata Application"
      urls:
        - "http://localhost:5000"
        - "http://localhost:5173"
  parameters:
    failOnError: false
    failOnWarning: false
    progressToStdout: true

jobs:
  - type: passiveScan-config
    parameters:
      scanOnlyInScope: true
      maxAlertsPerRule: 10

  - type: requestor
    requests:
      - url: "http://localhost:5000/api/health"
      - url: "http://localhost:5000/api/auth/login"
      - url: "http://localhost:5000/api/auth/register"
      - url: "http://localhost:5000/api/expenses"
      - url: "http://localhost:5173/"
      - url: "http://localhost:5173/login"
      - url: "http://localhost:5173/register"

  - type: spider
    parameters:
      context: "Khata Application"
      url: "http://localhost:5173"
      maxDuration: 1

  - type: passiveScan-wait
    parameters:
      maxDuration: 1

  - type: report
    parameters:
      template: "traditional-html"
      reportDir: "C:\\Users\\asus\\OneDrive\\Documents\\Vs code\\Blockchain and cybersecurity\\Security Foundations, AppSec and DevSecOps\\Appsec_project\\reports\\before"
      reportFile: "zap-report"
      reportTitle: "OWASP ZAP Baseline Security Report"
      reportDescription: "Baseline DAST vulnerability scan of Khata MERN Application"

  - type: report
    parameters:
      template: "traditional-json"
      reportDir: "C:\\Users\\asus\\OneDrive\\Documents\\Vs code\\Blockchain and cybersecurity\\Security Foundations, AppSec and DevSecOps\\Appsec_project\\reports\\before"
      reportFile: "zap-report"
      reportTitle: "OWASP ZAP Baseline Security Report"
